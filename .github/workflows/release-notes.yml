name: Tungsten release notes

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing public version tag to attach release notes to"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tungsten-github-releases
  cancel-in-progress: false

jobs:
  release-notes:
    if: github.repository == 'myoonhq/tungsten'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: release/.nvmrc
      - name: Verify release policy
        run: node --test automation/.github/scripts/github-release.test.mjs
      - name: Attach the reviewed notes to the public release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node ../automation/.github/scripts/github-release.mjs
